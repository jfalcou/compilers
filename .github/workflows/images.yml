##======================================================================================================================
##  Multi-Arch C++ & WebAssembly Development Environment
##======================================================================================================================
name: Container Images

on:
  pull_request:
    paths:
      - '*/Dockerfile'
      - '.github/workflows/images.yml'

  workflow_dispatch:
    inputs:
      image:
        description: 'Image to build'
        required: true
        type: choice
        options: [basic, cuda, sycl]
      tag:
        description: 'Tag to publish under, following the existing scheme (v11, sycl-v2, ...)'
        required: true
        type: string
      refresh:
        description: 'Ignore the layer cache and refetch everything - the only way to pick up new upstream packages'
        required: false
        default: false
        type: boolean

concurrency:
  group: images-${{ github.ref }}-${{ inputs.image }}
  cancel-in-progress: true

jobs:
  ##====================================================================================================================
  ## A pull request only rebuilds what it actually touched - a full sweep is tens of minutes per image
  ##====================================================================================================================
  select:
    name: Select Images
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.select.outputs.images }}

    steps:
      - name: Fetch current branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Select Images to Build
        id: select
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          PICKED: ${{ inputs.image }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            images="[\"$PICKED\"]"
          else
            # Only an image directory's own Dockerfile counts - previous/ holds archived recipes in
            # subdirectories and builds nothing. grep exits 1 on no match, which pipefail would turn
            # into a failed step, yet a pull request touching only this workflow is a perfectly
            # ordinary empty selection.
            touched=$(git diff --name-only "$BASE" HEAD              \
                      | { grep -E '^[^/]+/Dockerfile$' || true; }    \
                      | cut -d/ -f1 | sort -u)

            # A Dockerfile the pull request deleted still shows up above, and its directory is gone.
            kept=""
            for dir in $touched; do
              if [ -f "$dir/Dockerfile" ]; then kept="$kept$dir"$'\n'; fi
            done

            images=$(printf '%s' "$kept" | python3 -c 'import json,sys; print(json.dumps([l.strip() for l in sys.stdin if l.strip()]))')
          fi

          echo "images=$images" >> "$GITHUB_OUTPUT"
          echo "Building $images"

  ##====================================================================================================================
  ## A pull request builds without publishing, so a broken Dockerfile is caught before it is tagged
  ##====================================================================================================================
  build:
    name: ${{ matrix.image }}
    needs: select
    if: needs.select.outputs.images != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 360

    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.select.outputs.images) }}

    steps:
      - name: Fetch current branch
        uses: actions/checkout@v7

      - name: Reclaim Runner Disk Space
        shell: bash
        run: |
          # The toolchains, the Emscripten SDK and the Intel SDE together go well past what a
          # runner leaves free out of the box.
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup
          df -h /

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name == 'workflow_dispatch'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      ##================================================================================================================
      ## The runner is a fresh machine every time, so BuildKit's own cache is always empty and every build reinstalls
      ## the toolchain from scratch. Keeping the layers in GHCR next to the image is what makes a pull request that
      ## touches the smoke test cost seconds instead of five minutes.
      ##
      ## Reading it needs nothing; writing it needs the login above, so only a dispatch exports. And the cache keys on
      ## the *text* of each instruction, not on what apt would install today - a cached rebuild faithfully reproduces
      ## last month's packages, which is why refreshing them is a deliberate input rather than a side effect.
      ##================================================================================================================
      - name: Build and Publish
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.image }}
          push: ${{ github.event_name == 'workflow_dispatch' }}
          tags: ghcr.io/${{ github.repository }}:${{ inputs.tag || format('{0}-dry-run', matrix.image) }}
          no-cache: ${{ inputs.refresh == true }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}:${{ matrix.image }}-buildcache
          cache-to: ${{ github.event_name == 'workflow_dispatch' && format('type=registry,ref=ghcr.io/{0}:{1}-buildcache,mode=max', github.repository, matrix.image) || '' }}
